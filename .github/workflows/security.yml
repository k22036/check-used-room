name: Security Scan (Actions)
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6"

jobs:
  # ------------------------------------------------------------------
  # 1. Zizmor: GitHub Actions ワークフロー自体のセキュリティ検査
  # ------------------------------------------------------------------
  zizmor:
    name: Zizmor (Actions Security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          advanced-security: false
          annotations: true

  # ------------------------------------------------------------------
  # 2. React Doctor: セキュリティ，パフォーマンスの問題を検査
  # ------------------------------------------------------------------
  react-doctor:
    name: React Doctor (Security & Performance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2.4.0
        with:
          scope: "full"
